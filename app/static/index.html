<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOC Copilot</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --orange: #e3b341;
      --purple: #bc8cff;
      --cyan: #39d353;
      --tool-bg: #0c2d48;
      --tool-border: #1f6feb;
      --result-bg: #0d2626;
      --result-border: #238636;
      --thinking-bg: #1c1f26;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
    }

    .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .logo span { color: var(--text-muted); font-weight: 400; }
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: calc(100vh - 57px);
    }

    /* === LEFT PANEL === */
    .left-panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    textarea {
      flex: 1;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: none;
      padding: 16px;
      font-family: inherit;
      font-size: 12px;
      resize: none;
      outline: none;
      line-height: 1.7;
    }

    textarea::placeholder { color: var(--text-muted); }

    .left-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--surface);
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* === RIGHT PANEL === */
    .right-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .tab {
      padding: 12px 20px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; flex: 1; overflow-y: auto; padding: 16px; }
    .tab-content.active { display: block; }

    /* === AGENT TRACE === */
    .event {
      margin-bottom: 10px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

    .event-header {
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .event-body {
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .event.thinking { background: var(--thinking-bg); border-color: var(--border); }
    .event.thinking .event-header { color: var(--text-muted); }

    .event.tool_call { background: var(--tool-bg); border-color: var(--tool-border); }
    .event.tool_call .event-header { color: var(--accent); }

    .event.tool_result { background: var(--result-bg); border-color: var(--result-border); }
    .event.tool_result .event-header { color: var(--green); }

    .event.error { background: #2d1117; border-color: var(--red); }
    .event.error .event-header { color: var(--red); }

    .tool-input {
      margin-top: 6px;
      padding: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }

    /* === REPORT === */
    .report-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-muted);
      flex-direction: column;
      gap: 8px;
    }

    .severity-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .severity-CRITICAL { background: #4a0000; color: var(--red); border: 1px solid var(--red); }
    .severity-HIGH { background: #3d1a00; color: var(--orange); border: 1px solid var(--orange); }
    .severity-MEDIUM { background: #3d3000; color: var(--yellow); border: 1px solid var(--yellow); }
    .severity-LOW { background: #0d2d00; color: var(--green); border: 1px solid var(--green); }

    .action-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .action-ESCALATE { background: #4a0000; color: var(--red); }
    .action-BLOCK { background: #3d1a00; color: var(--orange); }
    .action-MONITOR { background: #3d3000; color: var(--yellow); }
    .action-CLOSE { background: #0d2d00; color: var(--green); }

    .report-section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .ioc-item {
      display: grid;
      grid-template-columns: 70px 1fr auto;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      align-items: start;
    }

    .ioc-type {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding-top: 2px;
    }

    .ioc-value { font-size: 12px; word-break: break-all; }
    .ioc-detail { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .confidence-bar {
      width: 50px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .confidence-fill { height: 100%; background: var(--accent); border-radius: 2px; }

    .mitre-item {
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .mitre-id { color: var(--accent); font-weight: 700; font-size: 13px; }
    .mitre-name { color: var(--text); margin-left: 8px; }
    .mitre-tactic { font-size: 11px; color: var(--purple); margin-top: 4px; }
    .mitre-desc { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }

    .step-list { list-style: none; }
    .step-list li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      font-size: 12px;
    }
    .step-num { color: var(--accent); min-width: 20px; }

    .notes-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar {
      padding: 8px 18px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">SOC <span>Copilot</span></div>
  <div class="badge">RESEARCH PROTOTYPE</div>
  <div class="badge" style="margin-left:auto">Claude + MCP</div>
</header>

<div class="layout">
  <!-- LEFT: Alert Input -->
  <div class="left-panel">
    <div class="panel-header">
      Alert Payload (JSON)
      <span style="color:var(--accent);cursor:pointer" onclick="loadSample()">Load Sample</span>
    </div>
    <textarea id="alertInput" placeholder='{"alert_id": "...", "event_type": "...", "source_ip": "..."}'></textarea>
    <div class="left-footer">
      <button id="analyzeBtn" onclick="analyze()">Analyze Alert</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
      <span id="inputError" style="color:var(--red);font-size:11px"></span>
    </div>
  </div>

  <!-- RIGHT: Output -->
  <div class="right-panel">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('trace', this)">Agent Trace</div>
      <div class="tab" onclick="switchTab('report', this)">Incident Report</div>
    </div>

    <!-- Agent Trace -->
    <div id="tab-trace" class="tab-content active">
      <div id="traceContainer">
        <div class="report-empty">
          <div style="font-size:32px">🔍</div>
          <div>Submit an alert to start the investigation</div>
        </div>
      </div>
    </div>

    <!-- Report -->
    <div id="tab-report" class="tab-content">
      <div id="reportContainer">
        <div class="report-empty">
          <div style="font-size:32px">📋</div>
          <div>Report will appear here after investigation completes</div>
        </div>
      </div>
    </div>

    <div class="status-bar" id="statusBar">
      <span id="statusText">Ready</span>
    </div>
  </div>
</div>

<script>
const SAMPLES = [
  {
    alert_id: "ALT-2024-001",
    event_type: "outbound_connection",
    source_ip: "10.0.1.45",
    destination_ip: "185.220.101.47",
    domain: "cmd.evil-domain.ru",
    timestamp: "2024-01-15T14:23:11Z",
    raw_log: "Jan 15 14:23:11 firewall PERMIT src=10.0.1.45 dst=185.220.101.47 dport=4444",
    additional_context: { user: "john.doe", host: "WORKSTATION-042", bytes_sent: 48200 }
  },
  {
    alert_id: "ALT-2024-002",
    event_type: "malware_execution",
    source_ip: "10.0.2.100",
    file_hash: "d41d8cd98f00b204e9800998ecf8427e",
    hash_type: "md5",
    timestamp: "2024-01-16T09:15:00Z",
    raw_log: "Process created: C:\\Users\\admin\\AppData\\Local\\Temp\\svchost32.exe",
    additional_context: { host: "SERVER-DB-01", parent_process: "winword.exe", user: "svc_account" }
  },
  {
    alert_id: "ALT-2024-003",
    event_type: "dns_query",
    source_ip: "10.0.3.22",
    domain: "malware-c2.tk",
    timestamp: "2024-01-17T22:05:33Z",
    raw_log: "DNS query: malware-c2.tk -> NXDOMAIN (3 retries)",
    additional_context: { query_count: 47, interval_seconds: 30, host: "LAPTOP-HR-05" }
  }
];

let currentSample = 0;

function loadSample() {
  document.getElementById('alertInput').value = JSON.stringify(SAMPLES[currentSample % SAMPLES.length], null, 2);
  currentSample++;
  document.getElementById('inputError').textContent = '';
}

function clearAll() {
  document.getElementById('alertInput').value = '';
  document.getElementById('traceContainer').innerHTML = `<div class="report-empty"><div style="font-size:32px">🔍</div><div>Submit an alert to start the investigation</div></div>`;
  document.getElementById('reportContainer').innerHTML = `<div class="report-empty"><div style="font-size:32px">📋</div><div>Report will appear here after investigation completes</div></div>`;
  setStatus('Ready');
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
}

function setStatus(text, spinning = false) {
  const bar = document.getElementById('statusBar');
  bar.innerHTML = spinning
    ? `<span class="spinner"></span><span>${text}</span>`
    : `<span id="statusText">${text}</span>`;
}

function appendEvent(event) {
  const container = document.getElementById('traceContainer');
  const div = document.createElement('div');
  div.className = `event ${event.type}`;

  const icons = { thinking: '◈', tool_call: '⚡', tool_result: '✓', error: '✗' };
  const labels = { thinking: 'Analysis', tool_call: 'Tool Call', tool_result: 'Tool Result', error: 'Error' };

  let body = '';
  if (event.type === 'tool_call' && event.tool_input) {
    body = `<div class="event-body">${escHtml(event.content)}<div class="tool-input">${escHtml(JSON.stringify(event.tool_input, null, 2))}</div></div>`;
  } else if (event.type === 'tool_result') {
    let content = event.content;
    try {
      content = JSON.stringify(JSON.parse(content), null, 2);
    } catch(e) {}
    body = `<div class="event-body">${escHtml(content)}</div>`;
  } else {
    body = `<div class="event-body">${escHtml(event.content)}</div>`;
  }

  div.innerHTML = `
    <div class="event-header">
      <span class="dot"></span>
      ${labels[event.type] || event.type}
      ${event.tool_name ? `— <span style="color:var(--cyan)">${escHtml(event.tool_name)}</span>` : ''}
    </div>
    ${body}
  `;

  // Remove placeholder if present
  const placeholder = container.querySelector('.report-empty');
  if (placeholder) placeholder.remove();

  container.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function renderReport(report) {
  if (!report) return;

  const sev = report.severity || 'UNKNOWN';
  const action = report.recommended_action || 'UNKNOWN';

  const iocHtml = (report.iocs || []).map(ioc => `
    <div class="ioc-item">
      <div class="ioc-type">${escHtml(ioc.type)}</div>
      <div>
        <div class="ioc-value">${escHtml(ioc.value)}</div>
        <div class="ioc-detail">${escHtml(ioc.details || ioc.source || '')}</div>
      </div>
      <div>
        <div class="confidence-bar">
          <div class="confidence-fill" style="width:${Math.round((ioc.confidence||0)*100)}%"></div>
        </div>
        <div style="font-size:10px;color:var(--text-muted);text-align:right;margin-top:2px">${Math.round((ioc.confidence||0)*100)}%</div>
      </div>
    </div>
  `).join('');

  const mitreHtml = (report.mitre_techniques || []).map(t => `
    <div class="mitre-item">
      <div><span class="mitre-id">${escHtml(t.technique_id)}</span><span class="mitre-name">${escHtml(t.technique_name)}</span></div>
      <div class="mitre-tactic">▸ ${escHtml(t.tactic)}</div>
      <div class="mitre-desc">${escHtml(t.description)}</div>
    </div>
  `).join('');

  const stepsHtml = (report.investigation_steps || []).map((s, i) => `
    <li><span class="step-num">${i+1}.</span>${escHtml(s)}</li>
  `).join('');

  const fpHtml = (report.false_positive_indicators || []).length
    ? `<div class="report-section"><div class="section-title">False Positive Indicators</div>${(report.false_positive_indicators||[]).map(f=>`<div style="padding:4px 0;font-size:12px;color:var(--text-muted)">• ${escHtml(f)}</div>`).join('')}</div>`
    : '';

  document.getElementById('reportContainer').innerHTML = `
    <div style="max-width:800px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        <span class="severity-badge severity-${sev}">${sev}</span>
        <span class="action-badge action-${action}">${action}</span>
        <span style="color:var(--text-muted);font-size:11px">Alert ${escHtml(report.alert_id||'')}</span>
      </div>

      <div class="report-section">
        <div class="section-title">Summary</div>
        <div style="font-size:13px;line-height:1.7">${escHtml(report.summary||'')}</div>
        ${report.escalation_reason ? `<div style="margin-top:8px;padding:8px 12px;background:#2d1117;border:1px solid var(--red);border-radius:6px;font-size:12px;color:var(--red)">⚠ ${escHtml(report.escalation_reason)}</div>` : ''}
      </div>

      ${iocHtml ? `<div class="report-section"><div class="section-title">Indicators of Compromise (${(report.iocs||[]).length})</div>${iocHtml}</div>` : ''}
      ${mitreHtml ? `<div class="report-section"><div class="section-title">MITRE ATT&CK Techniques</div>${mitreHtml}</div>` : ''}

      <div class="report-section">
        <div class="section-title">Analyst Notes</div>
        <div class="notes-box">${escHtml(report.analyst_notes||'')}</div>
      </div>

      ${stepsHtml ? `<div class="report-section"><div class="section-title">Investigation Steps</div><ul class="step-list">${stepsHtml}</ul></div>` : ''}
      ${fpHtml}
    </div>
  `;
}

async function analyze() {
  const raw = document.getElementById('alertInput').value.trim();
  if (!raw) {
    document.getElementById('inputError').textContent = 'Paste an alert JSON first';
    return;
  }

  let alert;
  try {
    alert = JSON.parse(raw);
    document.getElementById('inputError').textContent = '';
  } catch(e) {
    document.getElementById('inputError').textContent = 'Invalid JSON: ' + e.message;
    return;
  }

  // Reset UI
  document.getElementById('traceContainer').innerHTML = '';
  document.getElementById('reportContainer').innerHTML = `<div class="report-empty"><div style="font-size:32px">📋</div><div>Waiting for investigation to complete...</div></div>`;
  document.getElementById('analyzeBtn').disabled = true;
  setStatus('Investigation running...', true);

  // Switch to trace tab
  document.querySelectorAll('.tab')[0].click();

  try {
    const response = await fetch('/analyze/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(alert)
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (!data) continue;

        try {
          const event = JSON.parse(data);

          if (event.type === 'done') break;

          if (event.type === 'report') {
            try {
              const report = JSON.parse(event.content);
              renderReport(report);
              // Auto-switch to report tab
              document.querySelectorAll('.tab')[1].click();
              setStatus(`Investigation complete — ${report.severity} | ${report.recommended_action}`);
            } catch(e) {
              setStatus('Investigation complete');
            }
          } else if (event.type === 'error') {
            appendEvent(event);
            setStatus('Error: ' + event.content);
          } else {
            appendEvent(event);
            if (event.type === 'tool_call') {
              setStatus(`Calling ${event.tool_name}...`, true);
            }
          }
        } catch(e) {
          // Ignore parse errors on individual events
        }
      }
    }
  } catch(e) {
    appendEvent({ type: 'error', content: e.message });
    setStatus('Failed: ' + e.message);
  } finally {
    document.getElementById('analyzeBtn').disabled = false;
    if (document.getElementById('statusBar').querySelector('.spinner')) {
      setStatus('Done');
    }
  }
}

function escHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Load first sample on page load
loadSample();
</script>
</body>
</html>
